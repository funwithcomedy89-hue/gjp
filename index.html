<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="Hide and reveal secret messages inside any single emoji." />
  <title>VEIL — Emoji Steganography</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="./icon.svg" alt="VEIL logo" class="brand-mark" width="28" height="28" />
        <div>
          <h1>VEIL</h1>
          <span class="subtitle">Unicode Steganography</span>
        </div>
      </div>

      <button id="installBtn" class="btn-ghost hidden" type="button">
        Install
      </button>
    </header>

    <nav class="tabs" role="tablist" aria-label="Mode">
      <button class="tab active" role="tab" aria-selected="true" data-tab="encode" type="button">
        Encode
      </button>
      <button class="tab" role="tab" aria-selected="false" data-tab="decode" type="button">
        Decode
      </button>
    </nav>

    <!-- ENCODE PANEL -->
    <section id="panel-encode" class="panel active" role="tabpanel">
      <div class="field">
        <div class="label-row">
          <label for="customEmoji">Carrier emoji</label>
          <span class="meta">Pick or type any</span>
        </div>

        <div class="emoji-bar" id="emojiBar">
          <button type="button" class="emoji-chip active" data-emoji="👁️">👁️</button>
          <button type="button" class="emoji-chip" data-emoji="✨">✨</button>
          <button type="button" class="emoji-chip" data-emoji="🖤">🖤</button>
          <button type="button" class="emoji-chip" data-emoji="🔥">🔥</button>
          <button type="button" class="emoji-chip" data-emoji="👻">👻</button>
          <button type="button" class="emoji-chip" data-emoji="🌙">🌙</button>
          <button type="button" class="emoji-chip" data-emoji="⚡">⚡</button>
          <input
            id="customEmoji"
            class="emoji-custom"
            type="text"
            placeholder="+"
            aria-label="Custom carrier emoji"
            maxlength="8"
          />
        </div>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="secretInput">Secret message</label>
          <span id="byteCount" class="mono-meta">0 B</span>
        </div>
        <textarea
          id="secretInput"
          rows="4"
          placeholder="Type the message you want to hide..."
          spellcheck="false"
        ></textarea>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="encodeKey">Passphrase</label>
          <span class="meta">Optional · AES-256</span>
        </div>
        <div class="input-wrap">
          <input
            id="encodeKey"
            type="password"
            placeholder="Leave blank for open decode"
            autocomplete="off"
          />
          <button class="toggle-vis" type="button" data-target="encodeKey" aria-label="Toggle passphrase visibility">
            Show
          </button>
        </div>
      </div>

      <button id="encodeBtn" class="btn-primary" type="button">
        Encode into Emoji
      </button>

      <div id="encodeResult" class="result-card hidden">
        <div class="result-top">
          <div class="emoji-preview" id="encodedPreview" aria-live="polite"></div>
          <div class="result-info">
            <p class="result-title" id="encodedStatus">Ready to copy</p>
            <p class="mono-meta" id="encodedStats"></p>
          </div>
          <button id="copyEncodedBtn" class="btn-secondary" type="button">Copy</button>
        </div>
      </div>
    </section>

    <!-- DECODE PANEL -->
    <section id="panel-decode" class="panel" role="tabpanel">
      <div class="field">
        <div class="label-row">
          <label for="encodedInput">Encoded emoji</label>
          <button id="pasteBtn" class="link-btn" type="button">Paste</button>
        </div>
        <textarea
          id="encodedInput"
          rows="3"
          placeholder="Paste the emoji or message here..."
          spellcheck="false"
        ></textarea>
      </div>

      <div class="field" id="decodeKeyField">
        <div class="label-row">
          <label for="decodeKey">Passphrase</label>
          <span id="lockBadge" class="meta">Only if locked</span>
        </div>
        <div class="input-wrap">
          <input
            id="decodeKey"
            type="password"
            placeholder="Enter passphrase to unlock"
            autocomplete="off"
          />
          <button class="toggle-vis" type="button" data-target="decodeKey" aria-label="Toggle passphrase visibility">
            Show
          </button>
        </div>
      </div>

      <button id="decodeBtn" class="btn-primary" type="button">
        Reveal Message
      </button>

      <div id="decodeResult" class="result-card hidden">
        <div class="label-row">
          <span class="meta" id="decodeResultLabel">Hidden payload</span>
          <button id="copyDecodedBtn" class="link-btn" type="button">Copy</button>
        </div>
        <pre id="decodedOutput" class="decoded-text"></pre>
      </div>
    </section>

    <footer class="foot">
      <span>100% client-side · Zero server storage</span>
      <span id="toast" class="toast" role="status" aria-live="polite"></span>
    </footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
