<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Please! 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fdf5e6; /* Soft warm background */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Floating Pokemon Background */
        #bg-pokemon {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }
        .pokemon-sprite {
            position: absolute;
            opacity: 0.7;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
        }

        /* Main Card */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 200, 100, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
        }

        h1 { color: #ff8c00; margin-bottom: 10px; font-weight: 700; }
        
        .message-text {
            font-size: 18px;
            line-height: 1.5;
            color: #555;
            margin-bottom: 25px;
        }

        /* Polaroid Photo Frame */
        .photo-frame {
            background: white;
            padding: 10px 10px 30px 10px;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 0 auto 20px auto;
            width: fit-content;
            transform: rotate(-3deg);
            transition: transform 0.3s;
        }
        .photo-frame:hover {
            transform: rotate(0deg) scale(1.05);
        }
        .photo-frame img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 3px;
        }

        /* Button */
        button {
            background: #ffcc00;
            color: #d35400;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.4);
            transition: 0.3s;
        }
        button:hover {
            background: #ffdb4d;
            transform: scale(1.05);
        }

    </style>
</head>
<body>

    <!-- Floating Background -->
    <div id="bg-pokemon"></div>

    <!-- Main Content -->
    <div class="card">
        <h1>Hey Bestie! 🌟</h1>
        
        <!-- YAHAN PHOTO CHANGE KARNI HAI -->
        <div class="photo-frame">
            <img src="YOUR_PHOTO_LINK_HERE" alt="Cute Photo" id="friendPhoto">
        </div>
        
        <p class="message-text">
            I heard someone's mood is a bit off today. 😔<br><br>
            Just wanted to remind you that you are amazing, and your smile is brighter than a Pikachu's thunderbolt! ⚡💛
        </p>
        
        <button onclick="cheerUp()">Click for Magic! ✨</button>
    </div>

    <script>
        // Array of cute animated Pokemon sprites (Pikachu, Eevee, Jigglypuff, Togepi, Mew)
        const pokemons = [
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/25.gif",
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/133.gif",
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/39.gif",
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/175.gif",
            "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/151.gif"
        ];

        // Create floating background pokemon
        function createBackgroundPokemon() {
            const container = document.getElementById('bg-pokemon');
            const count = 15; // Number of floating pokemon

            for(let i = 0; i < count; i++) {
                let img = document.createElement('img');
                img.src = pokemons[Math.floor(Math.random() * pokemons.length)];
                img.classList.add('pokemon-sprite');
                
                // Random positioning and timing
                img.style.left = Math.random() * 100 + 'vw';
                img.style.width = (Math.random() * 40 + 40) + 'px'; // 40px to 80px size
                img.style.animationDuration = (Math.random() * 6 + 6) + 's'; // 6s to 12s float time
                img.style.animationDelay = (Math.random() * 5) + 's';
                
                container.appendChild(img);
            }
        }
        createBackgroundPokemon();

        // Button Click Event - Rains more pokemon!
        function cheerUp() {
            const container = document.getElementById('bg-pokemon');
            for(let i = 0; i < 20; i++) {
                setTimeout(() => {
                    let img = document.createElement('img');
                    img.src = pokemons[Math.floor(Math.random() * pokemons.length)];
                    img.classList.add('pokemon-sprite');
                    
                    img.style.left = Math.random() * 100 + 'vw';
                    img.style.width = '60px';
                    img.style.animationDuration = '3s'; // Fast float!
                    
                    container.appendChild(img);
                }, i * 100);
            }
        }

        // Quick check for standard image setup
        window.onload = function() {
            const imgEl = document.getElementById('friendPhoto');
            if(imgEl.src.includes('YOUR_PHOTO_LINK_HERE')) {
                // Default placeholder just in case the link isn't swapped yet
                imgEl.src = "https://media.tenor.com/b28JdJd3YpQAAAAj/pikachu-cute.gif"; 
            }
        }
    </script>
</body>
</html>
